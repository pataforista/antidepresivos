# Configuración mínima para Cloudflare Pages.
# El deploy de producción lo hace GitHub Actions (cloudflare/pages-action),
# que no lee este fichero; aquí solo se define lo necesario para que
# `npx wrangler pages dev` y `npx wrangler pages deploy` funcionen en local.
#
# Nota: las cabeceras de caché y los dominios personalizados se gestionan
# desde el dashboard de Cloudflare Pages (o con ficheros _headers/_redirects
# dentro del directorio publicado), no desde este TOML.
name = "antidepresivos"
compatibility_date = "2026-01-01"
pages_build_output_dir = "appantidepresivos/antidepresivos/web_app/public"
