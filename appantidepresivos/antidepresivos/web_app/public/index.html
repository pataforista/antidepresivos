    <main style="max-width:760px; margin:0 auto; padding:32px 20px; font-family:'DM Sans',sans-serif; color:#2C2420; line-height:1.6;">
      <h1 style="font-family:'Montserrat',sans-serif;">Antidepresivos — Comparador Clínico de Psicofármacos</h1>
      <p>Herramienta de soporte clínico para profesionales de la salud mental: comparador interactivo de antidepresivos, perfiles de riesgo (QT, sedación, peso), guías de switching basadas en Maudsley, NICE, APA y CANMAT, interacciones farmacológicas y monografías detalladas.</p>
      <h2>Funcionalidades principales</h2>
      <ul>
        <li>Monografías de farmacocinética, farmacodinámica, seguridad y dosis.</li>
        <li>Calculadora de switching entre fármacos.</li>
        <li>Comparador radial de perfiles de efectos adversos.</li>
        <li>Ajuste de dosis en poblaciones especiales (renal, hepático, geriátrico).</li>
        <li>PharmaQuiz: repaso gamificado de psicofarmacología.</li>
      </ul>
      <h2>Familias de antidepresivos incluidas</h2>
      <p>ISRS (fluoxetina, sertralina, escitalopram, paroxetina), IRSN (venlafaxina, duloxetina), tricíclicos, IMAO, mirtazapina, bupropión, agomelatina, vortioxetina y más.</p>
      <p>Información elaborada por el Dr. César Celada. Solo para uso consultivo por profesionales cualificados.</p>
    </main>
  </noscript>
