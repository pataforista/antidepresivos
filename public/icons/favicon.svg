       h 64
       a 16 16 0 0 1 16 16
       v 64
       h 64
       a 16 16 0 0 1 16 16
       v 64
       a 16 16 0 0 1 -16 16
       h -64
       v 64
       a 16 16 0 0 1 -16 16
       h -64
       a 16 16 0 0 1 -16 -16
       v -64
       h -64
       a 16 16 0 0 1 -16 -16
       v -64
       a 16 16 0 0 1 16 -16
       h 64
       v -64
       a 16 16 0 0 1 16 -16
       z"
    fill="#FFFFFF"
    opacity="0.95"
  />

  <!-- Punto decorativo inferior derecho (evoca "pastilla") -->
  <circle cx="368" cy="368" r="28" fill="#FFFFFF" opacity="0.35"/>
